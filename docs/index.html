
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIIF Image Viewer</title>
    <meta name="description" content="IIIF画像を閲覧できるシンプルなビューア。領域指定や回転表示に対応。">

    <!-- OGP -->
    <meta property="og:title" content="IIIF Image Viewer">
    <meta property="og:description" content="IIIF画像を閲覧できるシンプルなビューア。領域指定や回転表示に対応。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nakamura196.github.io/iiif-image-viewer/">
    <meta property="og:image" content="https://nakamura196.github.io/iiif-image-viewer/images/ogp.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="IIIF Image Viewer">
    <meta name="twitter:description" content="IIIF画像を閲覧できるシンプルなビューア。領域指定や回転表示に対応。">
    <meta name="twitter:image" content="https://nakamura196.github.io/iiif-image-viewer/images/ogp.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, h1, p {
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a73e8;
        }
        .input-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group.url-group {
            flex: 1;
            min-width: 200px;
            max-width: 500px;
        }
        .input-group label {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }
        input[type="number"] {
            width: 70px;
            padding: 10px 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            color: #333;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #1a73e8;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            color: #333;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        input[type="text"]::placeholder {
            color: #999;
        }
        button {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1557b0;
        }
        #viewer {
            flex: 1;
            min-height: 0;
            background: #e8e8e8;
        }
        .info {
            padding: 8px 24px;
            background: #fff;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        .info span {
            color: #1a73e8;
        }
    </style>
</head>
<body>
    <header>
        <h1>IIIF Image Viewer</h1>
        <div class="input-row">
            <div class="input-group url-group">
                <label for="iiif-url">IIIF</label>
                <input type="text" id="iiif-url" placeholder="info.json の URL">
            </div>
            <div class="input-group">
                <label for="xywh">領域</label>
                <input type="text" id="xywh" placeholder="x,y,w,h" style="width: 180px;">
            </div>
            <div class="input-group">
                <label for="rotation">回転</label>
                <input type="number" id="rotation" value="0" step="1">
                <span style="color:#666;">°</span>
            </div>
            <button onclick="loadImage()">読み込み</button>
        </div>
    </header>
    
    <div id="viewer"></div>
    
    <div class="info">
        操作: <span>ドラッグ</span> で移動 / <span>スクロール</span> でズーム / <span>ダブルクリック</span> で拡大
    </div>

    <script>
        let viewer = null;

        function initViewer(tileSource, rotation, xywh) {
            if (viewer) {
                viewer.destroy();
                viewer = null;
            }

            viewer = OpenSeadragon({
                id: "viewer",
                prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
                tileSources: tileSource,
                showNavigator: false,
                showRotationControl: true,
                showFullPageControl: true,
                animationTime: 0.3,
                minZoomImageRatio: 0.5,
                maxZoomPixelRatio: 4,
                degrees: rotation || 0,
            });

            // xywhが指定されている場合、その領域にフォーカス
            if (xywh) {
                viewer.addHandler('open', function() {
                    const parts = xywh.split(',').map(Number);
                    if (parts.length === 4) {
                        const [x, y, w, h] = parts;
                        const tiledImage = viewer.world.getItemAt(0);
                        const imageSize = tiledImage.getContentSize();

                        // 画像座標をビューポート座標に変換
                        const rect = new OpenSeadragon.Rect(
                            x / imageSize.x,
                            y / imageSize.x,
                            w / imageSize.x,
                            h / imageSize.x
                        );
                        viewer.viewport.fitBounds(rect, true);
                    }
                });
            }
        }

        function loadImage() {
            const url = document.getElementById('iiif-url').value.trim();
            const rotation = parseFloat(document.getElementById('rotation').value) || 0;
            const xywh = document.getElementById('xywh').value.trim();
            if (!url) {
                alert('URLを入力してください');
                return;
            }
            // URLパラメータに反映
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('iiif', url);
            newUrl.searchParams.set('rotation', rotation);
            if (xywh) {
                newUrl.searchParams.set('xywh', xywh);
            } else {
                newUrl.searchParams.delete('xywh');
            }
            history.pushState(null, '', newUrl);

            initViewer(url, rotation, xywh);
        }

        document.querySelectorAll('#iiif-url, #xywh, #rotation').forEach(function(el) {
            el.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadImage();
                }
            });
        });

        // URLパラメータから取得、なければサンプル画像
        const params = new URLSearchParams(window.location.search);
        const initialUrl = params.get('iiif') || 'https://ids.lib.harvard.edu/ids/iiif/47174896/info.json';
        const initialRotation = parseFloat(params.get('rotation')) || 0;
        const initialXywh = params.get('xywh') || '';
        document.getElementById('iiif-url').value = initialUrl;
        document.getElementById('rotation').value = initialRotation;
        document.getElementById('xywh').value = initialXywh;
        window.addEventListener('load', function() {
            initViewer(initialUrl, initialRotation, initialXywh);
        });
    </script>
</body>
</html>
